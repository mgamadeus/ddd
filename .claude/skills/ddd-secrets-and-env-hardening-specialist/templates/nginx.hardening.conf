# Inside the server {} block of every PHP vhost (prod AND dev workspaces).

# 1. Symfony profiler / web debug toolbar: never reachable from the internet.
#    /_profiler/phpinfo and /_profiler/latest?panel=request print the FULL process env ($_ENV) —
#    this is exactly how API keys, APP_SECRET, JWT keys and DB passwords leaked in Sept 2026.
location ~ ^/(?:_profiler|_wdt)(?:/|$) {
    return 403;
}

# 2. Only the front controller reaches php-fpm. `location ~ \.php$` executes ANY .php file in the
#    web root (e.g. a forgotten build helper) for anyone.
location ~ ^/index\.php(/|$) {
    fastcgi_pass php:9000;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    internal;
}
location ~ \.php$ {
    return 404;
}

# 3. Dotfiles and env-like files (defense in depth; they must not be in the web root anyway).
location ~ /\.(?!well-known) {
    deny all;
}

# 4. Dev workspaces (dev.example.com, <dev>.api.example.com, …): VPN-only.
#    allow <vpn-subnet>; deny all;   — or bind the vhost to the VPN interface. A dev vhost with
#    APP_DEBUG=1 on the public internet is a public env dump.
